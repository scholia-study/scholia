# Strategic-merge patch: env entries merge by name into the base's
# api container. Dev writes uploads to the dev media bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
    name: scholia-api
spec:
    template:
        spec:
            containers:
                - name: api
                  env:
                      - name: MEDIA_BUCKET
                        value: scholia-media-dev
