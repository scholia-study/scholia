# Strategic-merge patch: env entries merge by name into the base's
# web container.
#
# SENTRY_DSN is the scholia-web-prod Better Stack source (Node SSR
# side; ingest-only, public-safe). The same DSN ships in the browser
# bundle via apps/web/src/config.ts `_sentryDsnProd` — keep in sync.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholia-web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: APP_PROFILE
              value: prod
            - name: SENTRY_DSN
              value: "https://NvCH5CMCY7FBFhw2QTntdLrZ@s2637365.eu-central-1a.betterstackdata.com/2637365"
