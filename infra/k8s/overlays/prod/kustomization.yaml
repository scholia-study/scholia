# Prod environment overlay.
#
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: scholia

resources:
  - ../../base
  - ingest-jobs

generators:
  - secret-generator.yaml

images:
  - name: ghcr.io/scholia-study/scholia-api
    newTag: main-df22241
  - name: ghcr.io/scholia-study/scholia-web
    newTag: main-df22241
  - name: ghcr.io/scholia-study/scholia-proxy
    newTag: main-2263a2a

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: scholia
  - path: web-env-patch.yaml
    target:
      kind: Deployment
      name: scholia-web
  - path: backup-env-patch.yaml
    target:
      kind: CronJob
      name: postgres-backup
