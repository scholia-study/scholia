# KSOPS generator — turns the SOPS-encrypted files in secrets/ into real
# Secret resources at `kustomize build` time. Same mechanics as the dev
# overlay's generator (see that file for the full commentary); decryption
# happens on the PROD cluster's Argo repo-server with the prod age key.
#
# No proxy-dev-gate here: prod is public by design.

apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: scholia-secrets
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - secrets/postgres.yaml
  - secrets/api.yaml
  - secrets/assets-bucket.yaml
  - secrets/ntfy.yaml
